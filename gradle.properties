org.gradle.jvmargs=-Xmx2048M
java_version=21

minecraft_version=1.21.11
# Fabric loader dependency range advertised in fabric.mod.json (this branch only).
minecraft_dependency=>=1.21.11 <1.21.12
mappings=2
enabled_platforms=fabric

# Change these to your plugin id, version number and org or maven group, it must be unique.
archives_base_name=figurasvc
mod_version=2.1
maven_group=net.knownsh

# Meta Properties
# Change these to customize your mod's metadata. archives_base_name and plugin_id should match unless an override is intended.
plugin_id = figurasvc
display_name = FiguraSVC
description = Mic test? Can you see me?
authors = KnownSH, AliensToEarth

# Fabric Properties
# https://fabricmc.net/develop
# https://modrinth.com/mod/fabric-api
fabric_loader_version=0.16.14
fabric_api_version=0.141.3+1.21.11

# Figura Version
# https://maven.figuramc.org/#/releases/org/figuramc/figura-common-intermediary
figura_version=0.1.5

# Libraries
# https://github.com/FiguraMC/luaj
# https://github.com/TakahikoKawasaki/nv-websocket-client
luaj = 3.0.8
luaj-figura = 3.0.8-figura
websocket = 2.14